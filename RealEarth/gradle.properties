# Kept deliberately low. The first build runs several JVMs at once (Gradle itself plus the
# NeoForm tools that decompile Minecraft), and on a 16 GB machine with a browser open the sum of
# their default heaps exceeds the commit limit - the failure looks like "insufficient memory for
# the Java Runtime Environment", not like a Gradle error. Raise this only if the build is slow
# AND you have headroom to spare.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2

minecraft_version=1.21.1
neo_version=21.1.209
parchment_mc=1.21.1
parchment_version=2024.11.17

mod_id=realearth
mod_name=RealEarth
mod_version=0.3.0
mod_group_id=com.realearth
mod_license=MIT
